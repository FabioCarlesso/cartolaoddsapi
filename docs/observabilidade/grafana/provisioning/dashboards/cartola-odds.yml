# Provider que carrega os dashboards versionados em docs/observabilidade/.
# `foldersFromFilesStructure: false` e o diretorio unico mantem o JSON do
# repositorio como a unica fonte: editar pelo Grafana e possivel, mas some
# no proximo `docker compose up` se nao voltar para o arquivo.
apiVersion: 1

providers:
  - name: cartola-odds
    orgId: 1
    folder: Cartola Odds
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
