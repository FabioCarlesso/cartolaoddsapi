# ══════════════════════════════════════════════════════════════════════
# Prometheus — coleta das metricas do cartola-odds
#
# Usado pelo perfil `observabilidade` do docker-compose.yml:
#   docker compose --profile observabilidade up
#
# O alvo e /actuator/prometheus, que exige um token de ADMIN (a matriz do
# SecurityConfig nao abre metricas para anonimo). O token vai num arquivo,
# e nao aqui: o Prometheus nao expande variaveis de ambiente no config, e
# um token colado neste arquivo iria para o repositorio.
#
#   cp docs/observabilidade/scrape-token.example docs/observabilidade/scrape-token
#   # cole dentro o accessToken devolvido por POST /api/auth/login
#
# O token expira em JWT_EXPIRATION_MS (padrao 24 h) e nao ha renovacao: a
# coleta para quando ele vence, e refaze-la e colar um token novo. Enquanto
# a issue #44 (credencial de conta de maquina) nao fecha, este perfil serve
# para diagnostico e para validar dashboard e alertas — nao para monitoracao
# continua desassistida.
# ══════════════════════════════════════════════════════════════════════

global:
  # 30s cobre com folga uma metrica que muda no maximo algumas vezes por hora,
  # e mantem o alerta de saldo com granularidade suficiente.
  scrape_interval:     30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alertas-cota-odds.yml

scrape_configs:
  - job_name: cartola-odds
    metrics_path: /actuator/prometheus
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/scrape-token
    static_configs:
      # Nome do servico no compose. Fora do compose, troque por host:porta da aplicacao.
      - targets: ['cartola-odds:8080']
