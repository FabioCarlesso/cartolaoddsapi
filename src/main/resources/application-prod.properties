# ══════════════════════════════════════════════════════════════════════
# Perfil prod — ativado com SPRING_PROFILES_ACTIVE=prod
#
# Só o que muda em relação ao application.properties. Tudo o mais (banco,
# JWT, CORS, Actuator) continua vindo de lá, parametrizado por variável de
# ambiente.
# ══════════════════════════════════════════════════════════════════════

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
# Desligados em produção: o contrato completo da API — rotas, parâmetros,
# formato de cada corpo — é o mapa que um atacante levaria tempo montando na
# mão, e o "Try it out" do Swagger UI deixa disparar as chamadas dali mesmo.
# Com springdoc desligado as rotas não existem: /swagger-ui.html e
# /v3/api-docs respondem 404, e não 401 — nem confirmam que a documentação
# está lá, atrás de uma senha.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Logging ───────────────────────────────────────────────────────────
# DEBUG em com.cartola imprime, a cada requisição, o e-mail do dono de um token
# recusado (JwtAuthenticationFilter) e a URI de cada 401/403 (ErroSegurancaHandler).
# Em INFO nada disso sai.
#
# Nota: baixar o nível não é o que tira e-mail do log — as linhas de operação
# (login, criação, desativação, troca de senha) identificam o usuário por id
# justamente para não depender deste ajuste. A única linha que ainda cita e-mail
# é a criação do administrador inicial, uma vez por instância, e ela repete um
# valor que o próprio operador configurou em APP_ADMIN_INICIAL_EMAIL.
logging.level.com.cartola=INFO
