# ══════════════════════════════════════════════════════════════════════
# Perfil prod — ativado com SPRING_PROFILES_ACTIVE=prod
#
# Só o que muda em relação ao application.properties. Tudo o mais (banco,
# JWT, CORS, Actuator) continua vindo de lá, parametrizado por variável de
# ambiente.
# ══════════════════════════════════════════════════════════════════════

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
# Desligados em produção: o contrato completo da API — rotas, parâmetros,
# formato de cada corpo — é o mapa que um atacante levaria tempo montando na
# mão, e o "Try it out" do Swagger UI deixa disparar as chamadas dali mesmo.
# Com springdoc desligado as rotas não existem: /swagger-ui.html e
# /v3/api-docs respondem 404, e não 401 — nem confirmam que a documentação
# está lá, atrás de uma senha.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ── Logging ───────────────────────────────────────────────────────────
# DEBUG em com.cartola imprime e-mail de quem autentica e payload de
# requisição a cada chamada; em produção isso vira retenção de dado pessoal
# em log de plataforma.
logging.level.com.cartola=INFO
