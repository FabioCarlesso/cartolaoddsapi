# ── Servidor ──────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}
# Atrás da borda da plataforma o TLS termina no proxy e o Tomcat veria HTTP puro.
# O ForwardedHeaderFilter normaliza esquema, host e porta a partir dos X-Forwarded-*
# antes de a requisição chegar ao filter chain — é o que faz request.isSecure() ser
# verdadeiro e o HSTS sair em produção, e o que conserta o Location das respostas 201.
# Vale a ressalva de sempre: isso confia no proxy à frente para sobrescrever os
# X-Forwarded-* que um cliente tente enviar por conta própria.
server.forward-headers-strategy=framework

# ── The Odds API ──────────────────────────────────────────────────────
# Variavel de ambiente: ODDS_API_KEY
odds.api.key=${ODDS_API_KEY:SUA_API_KEY_AQUI}
odds.api.base-url=https://api.the-odds-api.com/v4
odds.api.sport=soccer_brazil_campeonato
odds.api.regions=us
odds.api.markets=h2h
odds.api.timeout=10000

# ── Cartola FC API ────────────────────────────────────────────────────
cartola.api.base-url=https://api.cartola.globo.com
cartola.api.timeout=15000

# ── Banco de dados (PostgreSQL) ───────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cartola_odds}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:cartola}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:cartola}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── Seguranca / JWT ───────────────────────────────────────────────────
# Segredo HMAC de assinatura dos tokens (minimo 32 caracteres). Sem padrao
# versionado: em producao e obrigatorio; fora dela, ausente, a aplicacao gera
# uma chave efemera a cada boot e avisa no log.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Freio de tentativas de login ──────────────────────────────────────
# Falhas toleradas por e-mail dentro da janela; a partir dai o login responde
# 429 ate a janela expirar. Um login bem-sucedido zera a contagem.
app.login.max-tentativas=${APP_LOGIN_MAX_TENTATIVAS:5}
app.login.janela-minutos=${APP_LOGIN_JANELA_MINUTOS:5}

# ── CORS ──────────────────────────────────────────────────────────────
# Origens do frontend, separadas por virgula. Nunca use '*': o token viaja em
# header e um curinga deixaria qualquer site chamar a API com o token da vitima.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ── Administrador inicial ─────────────────────────────────────────────
# Criado no primeiro boot quando nao existe nenhum ADMIN ativo. A senha nunca
# tem padrao: em producao e obrigatoria e a aplicacao falha ao iniciar sem ela.
app.admin-inicial.email=${APP_ADMIN_INICIAL_EMAIL:admin@cartolaodds.local}
app.admin-inicial.senha=${APP_ADMIN_INICIAL_SENHA:}

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.cartola=DEBUG
logging.level.org.springframework.web.client=INFO

# ── Actuator / Métricas ───────────────────────────────────────────────
# O Actuator vive na MESMA porta da aplicação. Antes ele ficava em 9090 com bind
# em 127.0.0.1, e era o bind — não uma regra — que o protegia; numa plataforma
# que publica uma porta só, esse arranjo não sobrevive. Na porta única quem
# protege é a matriz do SecurityConfig: health e info públicos (healthcheck da
# plataforma), metrics e prometheus só para ADMIN.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Mantém o health público sem detalhar componentes: o corpo anônimo é só
# {"status":"UP"}, sem estado de banco, disco e dependências.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=cartolaoddsapi
management.prometheus.metrics.export.enabled=true

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs
