# ── Servidor ──────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── The Odds API ──────────────────────────────────────────────────────
# Variavel de ambiente: ODDS_API_KEY
odds.api.key=${ODDS_API_KEY:SUA_API_KEY_AQUI}
odds.api.base-url=https://api.the-odds-api.com/v4
odds.api.sport=soccer_brazil_campeonato
odds.api.regions=us
odds.api.markets=h2h
odds.api.timeout=10000

# ── Cartola FC API ────────────────────────────────────────────────────
cartola.api.base-url=https://api.cartola.globo.com
cartola.api.timeout=15000

# ── Regras de negócio ─────────────────────────────────────────────────
# Variavel de ambiente: CARTOLA_ODD_LIMITE
cartola.odd-limite=${CARTOLA_ODD_LIMITE:3.0}

# Formação: GOL=1, LAT=2, ZAG=2, MEI=3, ATA=3, TEC=1
cartola.formacao.GOL=1
cartola.formacao.LAT=2
cartola.formacao.ZAG=2
cartola.formacao.MEI=3
cartola.formacao.ATA=3
cartola.formacao.TEC=1

# Pesos do score ponderado (devem somar 1.0)
# Variavel de ambiente: CARTOLA_SCORE_PESO_MEDIA_PONTOS etc.
cartola.score.peso.media-pontos=${CARTOLA_SCORE_PESO_MEDIA_PONTOS:0.40}
cartola.score.peso.valorizacao=${CARTOLA_SCORE_PESO_VALORIZACAO:0.20}
cartola.score.peso.desempenho=${CARTOLA_SCORE_PESO_DESEMPENHO:0.20}
cartola.score.peso.fator-casa=${CARTOLA_SCORE_PESO_FATOR_CASA:0.10}
cartola.score.peso.time-favorito=${CARTOLA_SCORE_PESO_TIME_FAVORITO:0.10}

# ── Flyway ────────────────────────────────────────────────────────────
spring.flyway.baseline-on-migrate=true

# ── Logging ───────────────────────────────────────────────────────────
logging.level.com.cartola=DEBUG
logging.level.org.springframework.web.client=INFO

# ── Swagger / OpenAPI ─────────────────────────────────────────────────
# Swagger UI: http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.path=/v3/api-docs
