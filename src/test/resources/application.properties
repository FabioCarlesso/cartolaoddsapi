# ── Servidor ─────────────────────────────────────────────────────────
# Espelha o application.properties de producao: sem isto o ForwardedHeaderFilter
# nao entra na cadeia e o teste de HSTS atras de proxy nao exercitaria o caminho real.
server.forward-headers-strategy=framework

# ── Banco em memoria para testes ─────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cartola_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# ── Seguranca / JWT ──────────────────────────────────────────────────
# Segredo fixo nos testes: sem ele o JwtService geraria uma chave nova por
# contexto, e o WARN de chave efemera poluiria a saida da suite.
jwt.secret=segredo-de-teste-apenas-para-a-suite-automatizada
jwt.expiration-ms=3600000

# ── Administrador inicial ────────────────────────────────────────────
# Obrigatoria: sem nenhum ADMIN ativo no banco e sem esta senha, o
# AdminInicialBootstrap derruba o contexto — que e exatamente o comportamento
# que se quer em producao.
app.admin-inicial.senha=senha-do-bootstrap-de-teste

# ── Desabilita logs verbosos do Hibernate nos testes ─────────────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=WARN

# ── Actuator / Métricas ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=cartolaoddsapi
management.prometheus.metrics.export.enabled=true
