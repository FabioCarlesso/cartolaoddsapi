# ── Banco em memoria para testes ─────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:cartola_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/h2

# ── Desabilita logs verbosos do Hibernate nos testes ─────────────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=WARN

# ── Actuator / Métricas ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=cartolaoddsapi
management.prometheus.metrics.export.enabled=true
