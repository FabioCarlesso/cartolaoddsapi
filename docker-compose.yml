services:

  postgres:
    image: postgres:16-alpine
    container_name: cartola-postgres
    environment:
      POSTGRES_DB:       cartola_odds
      POSTGRES_USER:     "${POSTGRES_USER:-cartola}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cartola}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartola} -d cartola_odds"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cartola-odds:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartola-odds
    image: cartola-odds:1.0.0
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── API Key (obrigatório) ──────────────────────────────────────
      ODDS_API_KEY: "${ODDS_API_KEY}"

      # ── Banco de dados ────────────────────────────────────────────
      SPRING_DATASOURCE_URL:      "jdbc:postgresql://postgres:5432/cartola_odds"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-cartola}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-cartola}"

      # ── Seguranca / JWT ───────────────────────────────────────────
      JWT_SECRET:               "${JWT_SECRET:-}"
      JWT_EXPIRATION_MS:        "${JWT_EXPIRATION_MS:-86400000}"

      # ── Administrador inicial ─────────────────────────────────────
      APP_ADMIN_INICIAL_EMAIL:  "${APP_ADMIN_INICIAL_EMAIL:-admin@cartolaodds.local}"
      APP_ADMIN_INICIAL_SENHA:  "${APP_ADMIN_INICIAL_SENHA:-}"

      # ── Freio de login e CORS ─────────────────────────────────────
      APP_LOGIN_MAX_TENTATIVAS: "${APP_LOGIN_MAX_TENTATIVAS:-5}"
      APP_LOGIN_JANELA_MINUTOS: "${APP_LOGIN_JANELA_MINUTOS:-5}"
      CORS_ALLOWED_ORIGINS:     "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"

      # ── JVM / Spring ──────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
