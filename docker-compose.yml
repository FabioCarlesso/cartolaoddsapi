services:

  postgres:
    image: postgres:16-alpine
    container_name: cartola-postgres
    environment:
      POSTGRES_DB:       cartola_odds
      POSTGRES_USER:     "${POSTGRES_USER:-cartola}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-cartola}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cartola} -d cartola_odds"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cartola-odds:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartola-odds
    image: cartola-odds:1.0.0
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # ── API Key (obrigatório) ──────────────────────────────────────
      ODDS_API_KEY: "${ODDS_API_KEY}"

      # ── Banco de dados ────────────────────────────────────────────
      SPRING_DATASOURCE_URL:      "jdbc:postgresql://postgres:5432/cartola_odds"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-cartola}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-cartola}"

      # ── Seguranca / JWT ───────────────────────────────────────────
      JWT_SECRET:               "${JWT_SECRET:-}"
      JWT_EXPIRATION_MS:        "${JWT_EXPIRATION_MS:-86400000}"

      # ── Administrador inicial ─────────────────────────────────────
      APP_ADMIN_INICIAL_EMAIL:  "${APP_ADMIN_INICIAL_EMAIL:-admin@cartolaodds.local}"
      APP_ADMIN_INICIAL_SENHA:  "${APP_ADMIN_INICIAL_SENHA:-}"

      # ── Freio de login e CORS ─────────────────────────────────────
      APP_LOGIN_MAX_TENTATIVAS: "${APP_LOGIN_MAX_TENTATIVAS:-5}"
      APP_LOGIN_JANELA_MINUTOS: "${APP_LOGIN_JANELA_MINUTOS:-5}"
      CORS_ALLOWED_ORIGINS:     "${CORS_ALLOWED_ORIGINS:-http://localhost:4200}"

      # ── Proxy confiavel ───────────────────────────────────────────
      # Sem valor de propósito: a variável só chega ao container se estiver
      # definida no ambiente. Passar "" aqui zeraria a lista de proxies
      # confiáveis — nenhum X-Forwarded-* seria aceito e o HSTS sumiria —,
      # enquanto não passar nada deixa valer o padrão do application.properties
      # (faixas privadas), que já cobre a rede do compose.
      TRUSTED_PROXIES:

      # ── JVM / Spring ──────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Perfil `observabilidade` (opcional) ─────────────────────────────
  # Sobe so com `docker compose --profile observabilidade up`. Fora do perfil
  # nada aqui e criado: monitorar a cota nao pode ser condicao para rodar a
  # aplicacao, e a stack padrao continua sendo postgres + cartola-odds.
  #
  # Antes da primeira subida, crie o arquivo de token (o scrape de
  # /actuator/prometheus exige ADMIN — ver docs/observabilidade/prometheus.yml):
  #   cp docs/observabilidade/scrape-token.example docs/observabilidade/scrape-token
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cartola-prometheus
    profiles: ["observabilidade"]
    depends_on:
      - cartola-odds
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docs/observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docs/observabilidade/alertas-cota-odds.yml:/etc/prometheus/alertas-cota-odds.yml:ro
      # Sintaxe longa por causa do `create_host_path: false`: sem ele, esquecer
      # de criar o arquivo faz o Docker montar um *diretorio* vazio no lugar, e
      # o Prometheus falha com "is a directory" — erro que nao aponta para a
      # causa. Assim o `up` para dizendo qual arquivo falta.
      - type: bind
        source: ./docs/observabilidade/scrape-token
        target: /etc/prometheus/scrape-token
        read_only: true
        bind:
          create_host_path: false
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      # A cota e mensal: uma retencao menor que isso perderia justamente a
      # visao de mes inteiro que o dashboard existe para dar.
      - "--storage.tsdb.retention.time=90d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: cartola-grafana
    profiles: ["observabilidade"]
    depends_on:
      - prometheus
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER:     "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_SENHA:-admin}"
      # Sem telemetria e sem checar versao nova: e uma stack local de
      # diagnostico, nao precisa falar com a internet.
      GF_ANALYTICS_REPORTING_ENABLED:   "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:   "false"
    volumes:
      - ./docs/observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docs/observabilidade/grafana-cota-odds.json:/var/lib/grafana/dashboards/grafana-cota-odds.json:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
