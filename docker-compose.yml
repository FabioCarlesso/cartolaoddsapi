services:

  cartola-odds:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cartola-odds
    image: cartola-odds:1.0.0
    network_mode: host
    environment:
      # ── API Key (obrigatório) ──────────────────────────────────────
      ODDS_API_KEY: "${ODDS_API_KEY}"

      # ── Regras de negócio (opcional, sobrescreve o application.properties) ──
      CARTOLA_ODD_LIMITE: "${CARTOLA_ODD_LIMITE:-3.0}"

      # ── Pesos do score (opcional) ─────────────────────────────────
      CARTOLA_SCORE_PESO_MEDIA_PONTOS:  "${CARTOLA_SCORE_PESO_MEDIA_PONTOS:-0.40}"
      CARTOLA_SCORE_PESO_VALORIZACAO:   "${CARTOLA_SCORE_PESO_VALORIZACAO:-0.20}"
      CARTOLA_SCORE_PESO_DESEMPENHO:    "${CARTOLA_SCORE_PESO_DESEMPENHO:-0.20}"
      CARTOLA_SCORE_PESO_FATOR_CASA:    "${CARTOLA_SCORE_PESO_FATOR_CASA:-0.10}"
      CARTOLA_SCORE_PESO_TIME_FAVORITO: "${CARTOLA_SCORE_PESO_TIME_FAVORITO:-0.10}"

      # ── JVM / Spring ──────────────────────────────────────────────
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"

    # Limites de recursos do container
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
        reservations:
          memory: 256m
          cpus: "0.25"

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v3/api-docs > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
